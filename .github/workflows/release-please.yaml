name: release-please
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish from'
        required: true
        type: string

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: navikt/github-app-token-generator@757386febfca7206eca81593f81558cd99bcee12
        id: get-token
        with:
          private-key: ${{ secrets.TOKENS_PRIVATE_KEY }}
          app-id: ${{ secrets.TOKENS_APP_ID }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.get-token.outputs.token }}
        if: github.event_name == 'push'
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
        with:
          token: ${{ steps.get-token.outputs.token }}
          fetch-depth: 0
      - name: Checkout tag for manual publish
        if: github.event_name == 'workflow_dispatch'
        run: git checkout ${{ github.event.inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          cache: 'npm'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: 2.9.0
      - run: npm ci
        if: ${{ steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
      - name: Build packages
        if: ${{ steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
        run: npm run build --workspaces=true

      # Publishing packages in topological order, as defined in `package.json`.
      - name: Publish @netlify/types
        if: ${{ steps.release.outputs['packages/types--release_created'] || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm publish packages/types/ --provenance --access=public || true
          else
            npm publish packages/types/ --provenance --access=public
          fi
      - name: Publish @netlify/aws-lambda-compat
        if:
          ${{ steps.release.outputs['packages/aws-lambda-compat--release_created'] || github.event_name ==
          'workflow_dispatch' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm publish packages/aws-lambda-compat/ --provenance --access=public || true
          else
            npm publish packages/aws-lambda-compat/ --provenance --access=public
          fi
      - name: Publish @netlify/dev-utils
        if:
          ${{ steps.release.outputs['packages/dev-utils--release_created'] || github.event_name == 'workflow_dispatch'
          }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npm publish packages/dev-utils/ --provenance --access=public || true
          else
            npm publish packages/dev-utils/ --provenance --access=public
          fi
      - name: Publish @netlify/runtime-utils
